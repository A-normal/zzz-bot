<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      width: 480px;
      background: #141518;
      border: 2px solid #2e3038;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
      color: #fff;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f59e0b;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    .title-box {
      display: flex;
      flex-direction: column;
    }
    .title-main {
      font-size: 20px;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: 1px;
    }
    .title-sub {
      font-size: 11px;
      color: #71717a;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    .uid-badge {
      background: #23242a;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
    }
    .status-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 18px;
    }
    .status-signed {
      background: rgba(34, 197, 94, 0.12);
      border: 1.5px solid #22c55e;
    }
    .status-pending {
      background: rgba(245, 158, 11, 0.12);
      border: 1.5px solid #f59e0b;
    }
    .status-text {
      font-size: 18px;
      font-weight: 800;
    }
    .status-signed .status-text { color: #4ade80; }
    .status-pending .status-text { color: #fbbf24; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .grid-item {
      background: #1c1d22;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid #2a2c33;
    }
    .grid-label {
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    .grid-val {
      font-size: 24px;
      font-weight: 900;
      color: #f4f4f5;
    }
    .grid-val span {
      font-size: 13px;
      color: #71717a;
      font-weight: normal;
      margin-left: 4px;
    }
    .auto-box {
      background: #1c1d22;
      padding: 14px 18px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2a2c33;
      font-size: 13px;
    }
    .auto-enabled {
      color: #4ade80;
      font-weight: bold;
    }
    .auto-disabled {
      color: #a1a1aa;
    }
    .footer {
      margin-top: 18px;
      font-size: 11px;
      color: #52525b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-box">
        <div class="title-main">绝区零米游社签到</div>
        <div class="title-sub">MIHOYO BBS COMMUNITY SIGN-IN</div>
      </div>
      <div class="uid-badge">UID: {{maskedUid}}</div>
    </div>

    <div class="status-banner {{isSigned ? 'status-signed' : 'status-pending'}}">
      <div class="status-text">{{isSigned ? '✔ 今日已完成签到' : '⏳ 今日尚未签到'}}</div>
      <div style="font-size: 13px; color: #a1a1aa;">{{todayDate}}</div>
    </div>

    <div class="grid">
      <div class="grid-item">
        <div class="grid-label">累计签到</div>
        <div class="grid-val">{{totalSignDay}}<span>天</span></div>
      </div>
      <div class="grid-item">
        <div class="grid-label">漏签天数</div>
        <div class="grid-val">{{missedDay}}<span>天</span></div>
      </div>
    </div>

    <div class="auto-box">
      <span style="color: #d4d4d8;">每日自动签到</span>
      <span class="{{autoEnabled ? 'auto-enabled' : 'auto-disabled'}}">
        {{autoEnabled ? '🟢 已开启 (' + (userSlot || '待调度') + ')' : '⚪ 未开启 (/开启自动签到)'}}
      </span>
    </div>

    <div class="footer">
      <span>米游社社区签到服务</span>
      <span>Created By ZZZ-Bot</span>
    </div>
  </div>
</body>
</html>
