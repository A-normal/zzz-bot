name: zzz-bot

services:
  zzz-yunzai:
    container_name: zzz-bot
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: zzz-bot:latest
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-16677}:2536"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DATA_ROOT:-./data/yunzai}:/root/Yunzai
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:2536/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
