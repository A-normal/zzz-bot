name: zzz-bot

services:
  zzz-yunzai:
    container_name: zzz-bot
    build:
      context: .
      dockerfile: Dockerfile
    image: zzz-bot:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:16677:2536"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      AICHAT_KEY_LOCAL: ${AICHAT_KEY_LOCAL:-}
      AICHAT_KEY_CLOUD: ${AICHAT_KEY_CLOUD:-}
    volumes:
      - ${DATA_ROOT:-/home/bjrst/docker/data}/zzz-bot/yunzai:/root/Yunzai
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:2536/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
