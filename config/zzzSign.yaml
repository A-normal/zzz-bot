# 绝区零米游社社区自动签到独立配置文件
# 完全独立于角色数据查询与面板获取，修改此文件不影响任何游戏数据读取

# 是否开启每日自动签到
autoSign: true

# 随机签到时间窗口（24小时制整数小时）
# 例如 7 到 22 表示每天在 07:00 ~ 22:00 之间的随机时刻触发签到，避免固定时刻风控
windowStart: 7
windowEnd: 22

# 签到成功是否私聊通知
notifySuccess: false

# 凭证失效/Cookie过期强提醒（当检测到未登录、Cookie失效时推送提醒）
notifyFailure: true

# 调试日志输出
debug: false
